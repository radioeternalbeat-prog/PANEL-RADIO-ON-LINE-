# Blueprint de despliegue para Render.com (https://render.com)
# Publica PANEL RADIO ONLINE como un único servicio web:
# el backend Express sirve la API, el WebSocket y el frontend compilado.
#
# Cómo usarlo:
#   1. Sube este repositorio a GitHub (ya está).
#   2. Entra a https://render.com, crea una cuenta y elige "New +" → "Blueprint".
#   3. Conecta este repositorio. Render detectará este archivo y creará el servicio.
#   4. Pulsa "Apply". En unos minutos tendrás una URL pública (https://...onrender.com).
#
# Inicia sesión con el usuario y contraseña configurados en ADMIN_USER / ADMIN_PASSWORD.
services:
  - type: web
    name: panel-radio-online
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: cd server && npm start
    # Disco persistente para conservar la base de datos y los audios subidos.
    # NOTA: los discos requieren un plan de pago en Render. En el plan gratuito,
    # omite este bloque (los datos se reinician en cada despliegue) o usa una BD externa.
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_TOKEN
        generateValue: true
      # Rutas persistentes (coinciden con el disco montado arriba).
      - key: DB_PATH
        value: /var/data/panel.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # Define una contraseña de admin fuerte (se usa al crear la BD por primera vez).
      - key: ADMIN_PASSWORD
        sync: false
      # OBLIGATORIO en producción: restringe CORS a tu dominio.
      # Ejemplo: https://panel-radio-online.onrender.com
      - key: CORS_ORIGIN
        sync: false
